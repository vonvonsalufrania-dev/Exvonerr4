<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ Publish Service</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #061a3b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 680px;
      margin: auto;
      padding: 32px;
      background: #123965;
      border: 2px solid #28649b;
      border-radius: 32px;
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
    }

    p {
      color: #a9c8e8;
      font-size: 20px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 28px;
      margin-bottom: 10px;
      color: #b8d7f5;
      font-size: 20px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 20px;
      border-radius: 20px;
      border: 2px solid #326c9f;
      background: #061f43;
      color: white;
      font-size: 22px;
      outline: none;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 28px 0;
      color: #d7e9fa;
      font-size: 18px;
    }

    .check input {
      width: 28px;
      height: 28px;
    }

    button {
      width: 100%;
      padding: 22px;
      border: 0;
      border-radius: 22px;
      background: #35b4f0;
      color: #06203f;
      font-size: 22px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 24px;
      padding: 20px;
      border: 2px solid #28649b;
      border-radius: 20px;
      color: #b8d7f5;
      font-size: 19px;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 24px;
    }

    .stat {
      flex: 1;
      padding: 25px;
      background: #092653;
      border: 2px solid #28649b;
      border-radius: 25px;
    }

    .number {
      font-size: 48px;
      font-weight: bold;
    }

    .created {
      color: #48c5ff;
    }

    .failed {
      color: #ff9999;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Place Settings</h1>

  <p>
    Bawat "place" dito ay BAGONG experience na kopya
    ng template place — hindi ito idinadagdag sa existing
    na laro mo.
  </p>

  <label>Template Place ID</label>
  <input id="placeId" value="952068881">

  <label>Place Amount</label>
  <input id="amount" type="number" value="5" min="1">

  <div class="check">
    <input id="private" type="checkbox" checked>
    <span>Create as Private Places</span>
  </div>

  <button onclick="startCreate()">
    START CREATE
  </button>

  <div class="result" id="result">
    Tapos na. Created: 0, Failed: 0.
  </div>

  <div class="stats">

    <div class="stat">
      <div class="number created" id="created">0</div>
      Created
    </div>

    <div class="stat">
      <div class="number failed" id="failed">0</div>
      Failed
    </div>

  </div>

</div>

<script>
function startCreate() {

  const amount =
    Number(document.getElementById("amount").value);

  if (amount < 1) {
    alert("Ilagay ang Place Amount.");
    return;
  }

  let created = 0;
  let failed = 0;

  const result =
    document.getElementById("result");

  result.textContent = "Gumagawa...";

  // DEMO LANG:
  // Ipinapakita nito kung paano gumagana
  // ang interface. Hindi pa nito kinokopya
  // ang Roblox place.

  let i = 0;

  const timer = setInterval(() => {

    i++;

    created++;

    document.getElementById("created")
      .textContent = created;

    result.textContent =
      "Tapos na. Created: " +
      created +
      ", Failed: " +
      failed + ".";

    if (i >= amount) {
      clearInterval(timer);
    }

  }, 500);
}
</script>

</body>
</html>
